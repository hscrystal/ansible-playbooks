---
# =====================================================================
# Playbook : change_user_password.yml
# Purpose  : Change an existing Linux user's password
#            - Input: username + plaintext password
#            - Password is hashed (SHA-512, $6$) before being applied
#            - Stops immediately if any input is missing / invalid
#            - Does NOT create the user if it doesn't exist
#
# Compatibility:
#   - Control node : Python 3.12
#   - Managed nodes: Python 3.9+
#   - Recommended  : ansible-core 2.20.x
#       (control node Python 3.12-3.14, managed node Python 3.9-3.14)
#       python3.12 -m pip install "ansible-core>=2.20,<2.21" passlib
#   - Hashing runs once on the control node (no Python needed on targets
#     for the hash itself; targets only run the 'user' / 'getent' modules):
#       1st try : Jinja filter password_hash('sha512')  (passlib recommended)
#       fallback: openssl passwd -6   (OpenSSL >= 1.1.1)
#
# Usage (interactive prompt):
#   ansible-playbook -i inventory change_user_password.yml --limit web01
#
# Usage (non-interactive, e.g. AWX/CI/Semaphore):
#   ansible-playbook -i inventory change_user_password.yml --limit webservers \
#     -e target_user=appuser -e new_password='S3cret!'
#
# NOTE: --limit is REQUIRED. The play refuses to run without it,
#       or when the limit is 'all' / '*'.
# =====================================================================

- name: Change user password
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: false
  any_errors_fatal: true        # if validation fails, stop on ALL hosts

  vars_prompt:
    - name: target_user
      prompt: "Username"
      private: false
      default: ""

    - name: new_password
      prompt: "New password (plaintext)"
      private: true
      confirm: true             # ask twice to prevent typos
      default: ""

  pre_tasks:
    # ---------------------------------------------------------------
    # 0) Guard - refuse to run without an explicit --limit
    #    (prevents changing the password on every host by mistake)
    # ---------------------------------------------------------------
    - name: Require --limit (Semaphore "Limit" field)
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_limit | string | trim | length > 0
          - (ansible_limit | string | trim | lower) not in ['all', '*', 'all:*', 'localhost']
        fail_msg: >-
          No target limit given (or limit is 'all' / '*').
          Please specify host(s) or group(s) in the Limit field
          (CLI: --limit <host_or_group>). Aborting - no changes made.
        success_msg: "Limit = {{ ansible_limit | default('') }}"
      run_once: true

    # ---------------------------------------------------------------
    # 1) Validate input - nothing is changed if this fails
    # ---------------------------------------------------------------
    - name: Validate that username and password are provided
      ansible.builtin.assert:
        that:
          - target_user is defined
          - target_user | string | trim | length > 0
          - new_password is defined
          - new_password | string | length > 0
        fail_msg: "Incomplete input: username and password are both required. Aborting - no changes made."
        success_msg: "Input check passed."
        quiet: true
      no_log: true              # never print the password in logs
      run_once: true

    - name: Validate username format
      ansible.builtin.assert:
        that:
          - target_user is match('^[a-z_][a-z0-9_.-]*[$]?$')
        fail_msg: "Invalid username format: '{{ target_user }}'"
        quiet: true
      run_once: true

    # ---------------------------------------------------------------
    # 2) Hash the password ONCE on the control node
    # ---------------------------------------------------------------
    - name: Hash the plaintext password (SHA-512)
      run_once: true
      delegate_to: localhost
      become: false
      no_log: true
      block:
        - name: Hash with password_hash filter
          ansible.builtin.set_fact:
            hashed_password: "{{ new_password | password_hash('sha512') }}"

      rescue:
        - name: Fallback - hash with openssl passwd -6
          ansible.builtin.command:
            cmd: openssl passwd -6 -stdin
            stdin: "{{ new_password }}"
          register: openssl_hash
          changed_when: false

        - name: Store openssl hash
          ansible.builtin.set_fact:
            hashed_password: "{{ openssl_hash.stdout | trim }}"

    - name: Verify hash format ($6$ SHA-512 crypt)
      ansible.builtin.assert:
        that:
          - hashed_password is defined
          - hashed_password is match('^[$]6[$]')
        fail_msg: >-
          Could not produce a SHA-512 hash on the control node.
          Install passlib (pip install passlib) or OpenSSL >= 1.1.1.
        quiet: true
      no_log: true
      run_once: true

    # ---------------------------------------------------------------
    # 3) Make sure the user already exists (never create a new one)
    # ---------------------------------------------------------------
    - name: Check that user exists on target host
      ansible.builtin.getent:
        database: passwd
        key: "{{ target_user }}"
        fail_key: false

    - name: Fail if user does not exist
      ansible.builtin.fail:
        msg: "User '{{ target_user }}' not found on {{ inventory_hostname }}. Aborting."
      when: ansible_facts['getent_passwd'][target_user] is none

  tasks:
    # ---------------------------------------------------------------
    # 4) Apply the hashed password
    # ---------------------------------------------------------------
    - name: Update password for {{ target_user }}
      ansible.builtin.user:
        name: "{{ target_user }}"
        password: "{{ hashed_password }}"
        update_password: always
        create_home: false
      no_log: true

    - name: Report result
      ansible.builtin.debug:
        msg: "Password for '{{ target_user }}' updated on {{ inventory_hostname }}."