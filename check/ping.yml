---
- name: "Get ping response"
  hosts: "{{ node | default('all') }}"
  gather_facts: true
  become: true
  tasks:
    - name: Ping
      ansible.builtin.ping:

    - name: Check sudo user
      ansible.builtin.command: whoami
      register: r
      changed_when: false

    - name: Show result
      ansible.builtin.debug:
        var: r.stdout
